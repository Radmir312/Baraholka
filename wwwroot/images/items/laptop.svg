  <text x="300" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">ThinkPad T14 Gen 2</text>
  <text x="300" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#a1a1aa" text-anchor="middle">Ryzen 7 • 16 GB • 512 GB SSD</text>
