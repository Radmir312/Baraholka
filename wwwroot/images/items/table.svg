<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#bgt)"/>
  <g transform="translate(150, 70)">
    <!-- Wooden Tabletop -->
    <polygon points="20,80 280,80 300,105 40,105" fill="#fde68a" stroke="#d97706" stroke-width="3"/>
    <rect x="40" y="105" width="260" height="15" fill="#d97706" rx="2"/>
    <!-- Metal legs -->
    <polygon points="60,120 75,120 75,230 60,230" fill="#1c1917"/>
    <polygon points="265,120 280,120 280,230 265,230" fill="#1c1917"/>
    <line x1="75" y1="200" x2="265" y2="200" stroke="#1c1917" stroke-width="8"/>
  </g>
  <text x="300" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">Лофт стол из массива дуба</text>
  <text x="300" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#fef3c7" text-anchor="middle">Массив дуба • Стальной каркас 140x70 см</text>
</svg>
