<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#bgc)"/>
  <g transform="translate(230, 45)">
    <!-- Headrest -->
    <rect x="35" y="0" width="70" height="25" rx="8" fill="#e9d5ff"/>
    <!-- Backrest -->
    <rect x="25" y="32" width="90" height="110" rx="14" fill="#ddd6fe" stroke="#a855f7" stroke-width="3"/>
    <!-- Lumbar support line -->
    <path d="M30 110 Q70 120 110 110" stroke="#7e22ce" stroke-width="4" fill="none"/>
    <!-- Seat -->
    <rect x="15" y="148" width="110" height="26" rx="10" fill="#f3e8ff"/>
    <!-- Armrests -->
    <path d="M10 100 L10 145 M130 100 L130 145" stroke="#e9d5ff" stroke-width="6" stroke-linecap="round"/>
    <!-- Base gas lift -->
    <line x1="70" y1="174" x2="70" y2="225" stroke="#e9d5ff" stroke-width="10"/>
    <line x1="15" y1="225" x2="125" y2="225" stroke="#e9d5ff" stroke-width="8" stroke-linecap="round"/>
  </g>
  <text x="300" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">Офисное эргономичное кресло</text>
  <text x="300" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#ddd6fe" text-anchor="middle">Сетка • 3D подлокотники • Поддержка спины</text>
</svg>
